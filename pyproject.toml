[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aurora-research"
version = "0.1.0"
description = "Autonomous web research and SEO intelligence platform"
requires-python = ">=3.12,<3.13"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10.0",
  "pytest-asyncio>=0.24,<2.0",
  "pytest-cov>=6.0,<7.0",
  "respx>=0.21,<1.0",
  "aiosqlite>=0.20,<1.0",
  "mypy>=1.13,<2.0",
  "ruff>=0.8",
]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "live: calls real providers; needs AURORA_RUN_LIVE_INTEGRATION_TESTS=true",
  "postgres: needs AURORA_TEST_DATABASE_URL pointing at a disposable PostgreSQL database",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Dense rule tables / SQL / long literals; the formatter still wraps what it can.
"backend/migrations/**" = ["E501"]
"backend/tests/**" = ["E501"]  # long fixture literals and assertions
"backend/app/intelligence/**" = ["E501"]  # long prompt/comment lines
"backend/app/llm/**" = ["E501"]
"backend/app/graph/**" = ["E501"]  # long Cypher fragments and registry tables
"backend/app/seo/**" = ["E501"]  # audit rule tables and finding texts
"backend/app/api/routes/graph.py" = ["E501"]
"backend/app/tools/search_console_tool.py" = ["E501"]  # long error messages
"backend/app/monitoring/**" = ["E501"]
"backend/app/database/repositories/gsc_repository.py" = ["E501"]
"backend/app/api/routes/gsc.py" = ["E501"]
"backend/app/schemas/gsc.py" = ["E501"]
"backend/app/api/routes/keywords.py" = ["E501"]  # long OpenAPI descriptions
"backend/app/schemas/keywords.py" = ["E501"]
"backend/app/database/repositories/graph_sync_repository.py" = ["E501"]
"scripts/graph_admin.py" = ["E501"]
"scripts/evaluate_module4.py" = ["E501"]  # long objective and table literals
"backend/app/research/website_mapper.py" = ["E501"]
"backend/app/research/structured_extractor.py" = ["E501"]
"backend/app/research/research_report.py" = ["E501"]
"backend/app/research/website_discovery.py" = ["E501"]
"backend/app/research/entity_resolver.py" = ["E501"]
"backend/app/research/evidence_manager.py" = ["E501"]
"backend/app/database/repositories/intelligence_repository.py" = ["E501"]
"backend/app/research/website_intelligence_service.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
packages = ["app"]
ignore_missing_imports = true
