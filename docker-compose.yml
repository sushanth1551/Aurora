services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://aurora:${POSTGRES_PASSWORD:-aurora_dev_password}@postgres:5432/aurora
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aurora
      POSTGRES_USER: aurora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aurora_dev_password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurora -d aurora"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Knowledge graph (Module 5). Start only on demand: docker compose --profile graph up -d neo4j
  # Browser: http://localhost:${NEO4J_HTTP_PORT:-7474}  Bolt: bolt://localhost:${NEO4J_BOLT_PORT:-7687}
  # No APOC or other plugins are required. Ports are bound to 127.0.0.1 (not the network).
  # Set a strong NEO4J_PASSWORD with scripts/init-local-secrets.ps1; the fallback below is an
  # example only and start-aurora.ps1 refuses to start Neo4j with it. NEO4J_AUTH applies only
  # when the data volume is first created; init-local-secrets changes an existing password.
  neo4j:
    profiles: ["graph"]
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-aurora-local-only}
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USERNAME:-neo4j} -p ${NEO4J_PASSWORD:-aurora-local-only} 'RETURN 1'"]
      interval: 15s
      timeout: 10s
      retries: 10

volumes:
  postgres_data:
  neo4j_data:
